<!DOCTYPE html>
<html lang=
<head>
  <meta charset="UTF-8">
  <title>研究用ページ（ランダム割付）</title>
</head>

<body>

<h1>研究参加ページ</h1>

<p>
研究へのご協力ありがとうございます。<br>
下のボタンを押すと、無作為に研究条件へ割り当てられます。
</p>

<p style="text-align:center;">
<button onclick="randomAssign()"
style="
background-color:#2196f3;
color:white;
font-size:36px;
font-weight:bold;
padding:25px 50px;
border:none;
border-radius:15px;
cursor:pointer;
box-shadow:0 4px 8px rgba(0,0,0,0.2);
">
研究を開始する
</button>
</p>

<script>
function randomAssign() {

  // 以前の割付結果を確認
  let group = localStorage.getItem("assignedGroup");

  // 保存済みなら同じ群へ移動
  if (group) {
    window.location.href = group;
    return;
  }

  // 初回のみランダム割付
  if (Math.random() < 0.5) {
    group = "https://kadowakiyoichi-bit.github.io/rct-study/intervention.html";
  } else {
    group = "https://kadowakiyoichi-bit.github.io/rct-study/control.html";
  }

  // 結果を保存
  localStorage.setItem("assignedGroup", group);

  // 移動
  window.location.href = group;
}
</script>

</body>
</html>
